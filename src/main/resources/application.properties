spring.application.name=gestion-pedidos

# Perfil por defecto: local. En Render: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Render y otros PaaS inyectan PORT
server.port=${PORT:8080}

# JPA (común)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# JWT (en producción use JWT_SECRET largo vía variable de entorno)
app.jwt.secret=${JWT_SECRET:QualityGroup_GestionPedidos_DevSecret_Min32Chars_2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: lista separada por comas (origen exacto, incluya https://). Ejemplo:
# https://mi-app.vercel.app,https://mi-app.netlify.app,http://localhost:4200
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
